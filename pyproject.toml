[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-memory-core"
version = "0.2.0"
description = "Research prototype for temporal companion memory and persona consistency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
llm = ["openai>=2.0,<4"]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7"]
all = ["openai>=2.0,<4", "pytest>=8.2,<9", "pytest-cov>=5,<7"]

[project.scripts]
companion-memory = "companion_memory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
