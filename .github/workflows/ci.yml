name: ci

on:
  push:
    branches: [main, feat/assessment-core-loop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src eval
      - name: Unit tests
        run: pytest -q
      - name: Offline evaluation smoke test
        run: PYTHONPATH=src python eval/run.py --provider heuristic --preserve-turn-distance
